<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مراقب OTC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <h1>مراقب OTC</h1>
        <div id="sys" class="sys"><span class="dot"></span><span class="txt">جاري الاتصال…</span></div>
      </div>
      <button id="power" class="power" type="button"></button>
    </header>
    <div id="bar" class="bar hidden"></div>
    <main id="view" tabindex="-1"></main>
    <nav class="tabs" id="tabs">
      <button data-tab="home" class="on" type="button"></button>
      <button data-tab="pairs" type="button"></button>
      <button data-tab="history" type="button"></button>
      <button data-tab="research" type="button"></button>
      <button data-tab="settings" type="button"></button>
    </nav>
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
      <div class="scrim" data-close></div>
      <div class="panel">
        <div class="grab"></div>
        <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" data-close type="button" aria-label="إغلاق"></button></div>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </div>
    <div id="modal" class="modal hidden" role="alertdialog" aria-modal="true">
      <div class="scrim"></div>
      <div class="box"><h3 id="modalTitle"></h3><p id="modalText"></p>
        <div class="actions"><button id="modalOk" class="btn primary" type="button">تأكيد</button><button id="modalCancel" class="btn" type="button">إلغاء</button></div></div>
    </div>
  </div>
  <script src="../engine/core.js"></script>
  <script src="../engine/stats.js"></script>
  <script src="../engine/featurelib.js"></script>
  <script src="../engine/lifecycle.js"></script>
  <script src="../ui/ar.js"></script>
  <script src="../db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
